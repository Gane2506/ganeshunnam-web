# /etc/nginx/sites-available/cms.ganeshunnam.conf
# Headless WordPress for case studies. Optional: the site goes live without it (builds use the seed case studies).
# Needs PHP-FPM and WordPress in /var/www/cms.ganeshunnam.com; see README "WordPress setup".

server {
    listen 80;
    listen [::]:80;
    server_name cms.ganeshunnam.com;
    include snippets/cloudflare-allow.conf;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# --- cms.ganeshunnam.com (headless WordPress) -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.ganeshunnam.com;

    ssl_certificate     /etc/ssl/cloudflare/ganeshunnam.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ganeshunnam.com.key;
    include snippets/cloudflare-allow.conf;
    # Optional, strongest: Authenticated Origin Pulls (enable in Cloudflare → SSL/TLS → Origin Server first)
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    root /var/www/cms.ganeshunnam.com;
    index index.php;
    client_max_body_size 32m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /xmlrpc.php { deny all; }
    location ~* /wp-content/uploads/.*\.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }

    location /wp-content/uploads/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Access-Control-Allow-Origin "https://ganeshunnam.com" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # match your PHP-FPM version
    }
}
