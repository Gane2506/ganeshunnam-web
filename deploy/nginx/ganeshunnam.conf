# /etc/nginx/sites-available/ganeshunnam.conf
# Static site from GitHub Actions releases (root → /var/www/ganeshunnam/current, an atomic symlink)
# plus the headless WordPress at cms.ganeshunnam.com.
#
# Cloudflare sits in front (orange-cloud DNS, SSL mode "Full (strict)"), see deploy/cloudflare/README.md:
#   - TLS uses a Cloudflare Origin CA certificate (15 years, no certbot):
#       /etc/ssl/cloudflare/ganeshunnam.com.pem  +  /etc/ssl/cloudflare/ganeshunnam.com.key
#   - snippets/cloudflare-realip.conf restores the visitor IP from CF-Connecting-IP
#   - snippets/cloudflare-allow.conf lets only Cloudflare reach :443, so nobody can bypass the WAF/cache
#   Both snippets come from deploy/cloudflare/update-ips.sh (weekly cron).

# --- shared ---------------------------------------------------------------------------------------
include snippets/cloudflare-realip.conf;   # http-level: applies to every server below

map $sent_http_content_type $gu_expires {
    default                    off;
    text/html                  epoch;     # HTML always revalidates, so new deploys show at once
    application/xml            1h;
    ~image/                    30d;
    ~font/                     1y;
}

# --- http → https, www → apex -----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ganeshunnam.com www.ganeshunnam.com cms.ganeshunnam.com;
    include snippets/cloudflare-allow.conf;
    return 301 https://$host$request_uri;   # Cloudflare's "Always Use HTTPS" normally answers first
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx ≥ 1.25.1; older: use 'listen 443 ssl http2;'
    server_name www.ganeshunnam.com;
    ssl_certificate     /etc/ssl/cloudflare/ganeshunnam.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ganeshunnam.com.key;
    include snippets/cloudflare-allow.conf;
    # Optional, strongest: Authenticated Origin Pulls (enable in Cloudflare → SSL/TLS → Origin Server first)
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;
    return 301 https://ganeshunnam.com$request_uri;
}

# --- ganeshunnam.com (static) ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ganeshunnam.com;

    ssl_certificate     /etc/ssl/cloudflare/ganeshunnam.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ganeshunnam.com.key;
    include snippets/cloudflare-allow.conf;
    # Optional, strongest: Authenticated Origin Pulls (enable in Cloudflare → SSL/TLS → Origin Server first)
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:gu_ssl:10m;
    ssl_session_timeout 1d;

    root  /var/www/ganeshunnam/current;
    index index.html;
    disable_symlinks off;           # 'current' is a symlink into releases/
    etag on;
    expires $gu_expires;

    # compression: brotli if the module is installed (uncomment), gzip everywhere
    # brotli on; brotli_comp_level 5; brotli_static on;
    # brotli_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # security headers (repeated in nested locations because add_header does not inherit)
    set $gu_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cms.ganeshunnam.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests";
    add_header Content-Security-Policy $gu_csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Vite's hashed bundles never change: cache for a year, immutable
    location /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $gu_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:webp|avif|png|jpe?g|svg|ico|woff2)$ {
        expires off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # clean URLs: /casestudy/slug/ → /casestudy/slug/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # old site pages → closest new section (keeps inbound links and rankings)
    location = /web-development-toronto.html             { return 301 /#work; }
    location = /shopify-woocommerce-development.html     { return 301 /#work; }
    location = /seo-digital-marketing.html               { return 301 /#about; }
    location = /automation-integrations.html             { return 301 /#about; }
    location = /microsoft-365-google-workspace.html      { return 301 /#about; }
    location = /cloud-business-it.html                   { return 301 /#about; }
    location = /service-areas.html                       { return 301 /#contact; }
    location = /privacy.html                             { return 301 /privacy/; }
    location = /terms.html                               { return 301 /privacy/; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\. { deny all; }
}

# --- cms.ganeshunnam.com (headless WordPress) -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.ganeshunnam.com;

    ssl_certificate     /etc/ssl/cloudflare/ganeshunnam.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ganeshunnam.com.key;
    include snippets/cloudflare-allow.conf;
    # Optional, strongest: Authenticated Origin Pulls (enable in Cloudflare → SSL/TLS → Origin Server first)
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    root /var/www/cms.ganeshunnam.com;
    index index.php;
    client_max_body_size 32m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /xmlrpc.php { deny all; }
    location ~* /wp-content/uploads/.*\.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }

    location /wp-content/uploads/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Access-Control-Allow-Origin "https://ganeshunnam.com" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # match your PHP-FPM version
    }
}
