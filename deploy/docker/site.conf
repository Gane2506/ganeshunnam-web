# Container variant of deploy/nginx/ganeshunnam.conf, behind Nginx Proxy Manager (deploy/docker/compose.yml).
# NPM terminates TLS and forwards plain HTTP here, so no certificates, no :443 and no Cloudflare snippets.
# Keep the static server block below in sync with deploy/nginx/ganeshunnam.conf.

# visitor IP from NPM (Docker network 'web'); NPM itself sets X-Real-IP (from CF-Connecting-IP if behind Cloudflare)
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Real-IP;

map $sent_http_content_type $gu_expires {
    default                    off;
    text/html                  epoch;     # HTML always revalidates, so new deploys show at once
    application/xml            1h;
    ~image/                    30d;
    ~font/                     1y;
}

# www → apex (NPM forwards both names here)
server {
    listen 80;
    server_name www.ganeshunnam.com;
    return 301 https://ganeshunnam.com$request_uri;
}

# --- ganeshunnam.com (static) ---------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name ganeshunnam.com _;
    absolute_redirect off;          # redirects keep the https://ganeshunnam.com origin NPM was reached on

    root  /var/www/ganeshunnam/current;
    index index.html;
    disable_symlinks off;           # 'current' is a symlink into releases/
    etag on;
    expires $gu_expires;

    # compression: brotli if the module is installed (uncomment), gzip everywhere
    # brotli on; brotli_comp_level 5; brotli_static on;
    # brotli_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # security headers (repeated in nested locations because add_header does not inherit).
    # The script-src hash is the inline theme script in vite.config.js; `npm run build` prints it if that script changes.
    set $gu_csp "default-src 'self'; script-src 'self' 'sha256-WPxCpAkWbPEm75IV4qmFFC5FvGqJwA6+fExRsdDirI0='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cms.ganeshunnam.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests";
    add_header Content-Security-Policy $gu_csp always;
    add_header Strict-Transport-Security "max-age=86400" always;  # raise to 31536000 once the site has been stable for a week
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Vite's hashed bundles never change: cache for a year, immutable
    location /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $gu_csp always;
        add_header Strict-Transport-Security "max-age=86400" always;  # raise to 31536000 once the site has been stable for a week
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:webp|avif|png|jpe?g|svg|ico|woff2)$ {
        expires off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # clean URLs: /casestudy/slug/ → /casestudy/slug/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # old site pages → closest new section (keeps inbound links and rankings)
    location = /web-development-toronto.html             { return 301 /#work; }
    location = /shopify-woocommerce-development.html     { return 301 /#work; }
    location = /seo-digital-marketing.html               { return 301 /#about; }
    location = /automation-integrations.html             { return 301 /#about; }
    location = /microsoft-365-google-workspace.html      { return 301 /#about; }
    location = /cloud-business-it.html                   { return 301 /#about; }
    location = /service-areas.html                       { return 301 /#contact; }
    location = /privacy.html                             { return 301 /privacy/; }
    location = /terms.html                               { return 301 /privacy/; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\. { deny all; }
}
