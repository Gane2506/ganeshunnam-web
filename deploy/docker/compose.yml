# Static site container for a server where Nginx Proxy Manager already owns ports 80/443.
# Installed to /opt/ganeshunnam by deploy/server/bootstrap-npm.sh. NPM reaches it as ganeshunnam-web:80 over the
# shared `web` network; 127.0.0.1:8088 is only for the deploy smoke test from the server itself.
services:
  ganeshunnam-web:
    image: nginx:1.27-alpine
    container_name: ganeshunnam-web
    restart: unless-stopped
    volumes:
      - /var/www/ganeshunnam:/var/www/ganeshunnam:ro # 'current' symlink resolves inside the same path
      - ./site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8088:80'
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '--spider', '-T', '5', '--header', 'Host: ganeshunnam.com', 'http://127.0.0.1/']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web

networks:
  web:
    external: true # the network Nginx Proxy Manager's container is on
