name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cms-publish] # sent by the ganesh-casestudy WordPress plugin
  schedule:
    - cron: '17 7 * * *' # nightly safety rebuild (07:17 UTC)
  workflow_dispatch:

# deploys queue instead of cancelling, so a WordPress publish during a code deploy is never lost
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ganeshunnam.com
    env:
      WP_API_URL: ${{ vars.WP_API_URL }}
      SITE_URL: https://ganeshunnam.com
      RELEASE: ${{ github.sha }}-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Until the server is set up (docs/GO-LIVE.md), runs build and stop here instead of failing.
      - name: Check deploy settings
        id: cfg
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::Deploy secrets are not set yet, so this run only built the site. See docs/GO-LIVE.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # DEPLOY_HOST must be the origin IP or a DNS-only (grey-cloud) name: Cloudflare's proxy doesn't carry SSH.
      - name: Configure SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release
        if: steps.cfg.outputs.ready == 'true'
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          BASE: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy "$TARGET" "mkdir -p '$BASE/releases/$RELEASE'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" dist/ "$TARGET:$BASE/releases/$RELEASE/"

      - name: Activate release (atomic symlink swap) and keep the last 5
        if: steps.cfg.outputs.ready == 'true'
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          BASE: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy "$TARGET" bash -s <<EOS
          set -euo pipefail
          cd '$BASE'
          ln -sfn "releases/$RELEASE" current.tmp
          mv -Tf current.tmp current
          ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
          EOS

      # HTML can be cached at Cloudflare's edge (see deploy/cloudflare/README.md), so clear it on every release.
      # Hashed /assets/* would survive, but purge_everything keeps this simple and costs one origin hit per file.
      - name: Purge Cloudflare cache
        if: steps.cfg.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID not set; skipping cache purge"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | grep -q '"success":true'

      # Checks the origin from the server itself, so it works before DNS points here: the site container
      # (bootstrap-npm.sh, 127.0.0.1:8088) or system nginx (bootstrap.sh, :443) must serve this release's index.html.
      - name: Smoke test (origin)
        if: steps.cfg.outputs.ready == 'true'
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          want=$(sha256sum dist/index.html | cut -d' ' -f1)
          got=$(ssh -i ~/.ssh/deploy "$TARGET" \
            "curl -fsS -H 'Host: ganeshunnam.com' http://127.0.0.1:8088/ 2>/dev/null || curl -fsSk --resolve ganeshunnam.com:443:127.0.0.1 https://ganeshunnam.com/" \
            | sha256sum | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::origin is not serving this release's index.html"; exit 1; }

      - name: Smoke test (public)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://ganeshunnam.com/ || true)
          echo "https://ganeshunnam.com/ → $code"
          [ "$code" = 200 ] || echo "::warning::public site answered $code (expected until DNS points at the server)"
