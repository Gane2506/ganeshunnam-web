name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: PHP lint (WordPress plugin)
        run: php -l wordpress/ganesh-casestudy/ganesh-casestudy.php
      # no WP_API_URL here: PR builds prerender the seed case studies in content/casestudies
      - run: npm run build
      - name: Lighthouse CI (performance, accessibility, SEO budgets)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
