name: Capture site screenshots

# Screenshots and favicons of every live site the portfolio links to (scripts/capture-sites.mjs).
# Run by hand from Actions whenever a client site changes; optional "hosts" limits it to some sites.
on:
  workflow_dispatch:
    inputs:
      hosts:
        description: 'Space-separated hosts to refresh (empty: all), e.g. flooringliquidators.ca vinylsound.ca'
        required: false
        default: ''

permissions:
  contents: write # commit the images
  actions: write # start the deploy afterwards (pushes made with GITHUB_TOKEN don't trigger workflows)

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/capture-sites.mjs ${{ inputs.hosts }}
      - name: Commit and deploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/shots public/logos public/shots/sites.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh site screenshots and favicons"
          git push
          gh workflow run deploy.yml --ref main
